[versions]
# Java
java = "25"

# Database
mariadb = "3.5.10"
postgresql = "42.7.13"
hikaricp = "7.1.0"
jedis = "5.2.0"

# ConfigLib
configlib = "8efe7efb4062eb5625df5bef74447835785da6cc"

# SnakeYAML
snakeyaml = "2.7"

# Adventure (MiniMessage)
adventure = "4.26.1"
adventure-platform = "4.3.4"

# Paper API
paper-api = "1.21.4-R0.1-SNAPSHOT"

# Velocity API
velocity-api = "3.5.1"

# StrokkCommands
strokkcommands = "2.3.0"
brigadier = "1.4.0"

# Annotations
jetbrains-annotations = "26.1.0"
spotbugs-annotations = "4.10.4"
jspecify = "1.0.1"

# Testing
junit = "5.14.4"
mockito = "5.23.0"

[libraries]
# Database
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }

# ConfigLib
configlib-yaml = { module = "com.github.6b6t.ConfigLib:configlib-yaml", version.ref = "configlib" }

# SnakeYAML
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

# Adventure
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }

# Paper/Velocity API
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }

# StrokkCommands
strokkcommands-annotations-common = { module = "net.strokkur.commands:annotations-common", version.ref = "strokkcommands" }
strokkcommands-annotations-common-permission = { module = "net.strokkur.commands:annotations-common-permission", version.ref = "strokkcommands" }
strokkcommands-processor-common = { module = "net.strokkur.commands:processor-common", version.ref = "strokkcommands" }
strokkcommands-annotations-paper = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokkcommands" }
strokkcommands-processor-paper = { module = "net.strokkur.commands:processor-paper", version.ref = "strokkcommands" }
strokkcommands-annotations-velocity = { module = "net.strokkur.commands:annotations-velocity", version.ref = "strokkcommands" }
strokkcommands-processor-velocity = { module = "net.strokkur.commands:processor-velocity", version.ref = "strokkcommands" }
brigadier = { module = "net.strokkur:brigadier", version.ref = "brigadier" }

# Annotations
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[bundles]
testing = ["junit-jupiter", "mockito-core", "mockito-junit-jupiter"]
annotations = ["jetbrains-annotations", "spotbugs-annotations", "jspecify"]
adventure = ["adventure-api", "adventure-text-minimessage"]

[plugins]
